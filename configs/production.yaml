# Production-scale pipeline configuration.
#
# Targets a corpus large enough to be a credible paper artifact while fitting
# this host (12 vCPU, 31 GiB RAM, 2x Quadro P2000, ~310 GiB free disk).
#
# Sizing, from measured throughput on this exact host:
#   crawl       86 docs/s (NCBI caps at 3 req/s unauthenticated)
#               1.8M targets => ~5.8 h
#   chunk       3.74 chunks/doc (measured on a 40k-doc validation corpus)
#               ~1.0M docs => ~3.7M chunks
#   chunk store ~1.9 KiB/chunk blob, built at ~8,500 chunks/s, bounded memory
#   bm25        430 bytes/chunk measured => ~1.6 GiB resident
#   dense       110 rows/s on 2 GPUs with realistic ~200-token passages
#               3.7M chunks => ~9.4 h
#   disk        corpus ~1.5 GB + blob ~7 GB + embeddings ~5.7 GB + faiss ~5.7 GB
#
# Total is roughly 15 h of background work. Every stage is resumable and the
# artifact is usable at any partial size, so the run can be stopped at any
# point and the index still builds.
#
# Raise `acquire.max_records` to grow the corpus; nothing else needs changing.

paths:
  data_root: data
  corpus_dir: corpus
  index_dir: index
  cache_dir: cache
  runs_dir: runs
  log_dir: ../logs

acquire:
  source: pubmed
  # "" uses DEFAULT_QUERIES: RCTs, systematic reviews, meta-analyses, and
  # guidelines. These are the publication types with reliable indexing, so the
  # MeSH-derived relevance labels are trustworthy.
  query: ""
  filter_query: ""
  lang: english
  min_date: "1996/01/01"
  max_date: "2026/12/31"
  # PER-QUERY cap: the default query set has 6 slices, and measured overlap
  # between them means ~55% of targeted records survive as unique documents.
  # 6 x 300k targets => ~1.8M fetched => ~1.0M unique documents.
  max_records: 300000
  fetch_batch: 200
  max_requests_per_second: 3.0
  api_key: null          # set NCBI_API_KEY to raise the cap to 10 req/s
  email: null
  tool: medrag
  max_retries: 5
  request_timeout: 180
  shard_size: 10000

chunk:
  strategy: section
  target_tokens: 320
  max_tokens: 512
  overlap_tokens: 64
  min_tokens: 48
  context_fields: [title, section, journal, year]
  require_abstract: true

embed:
  model_name: BAAI/bge-small-en-v1.5
  query_prefix: "Represent this sentence for searching relevant passages: "
  pooling: cls
  normalize: true
  # Large batches matter more than anything else here: measured 827 rows/s at
  # bs=128 vs 1,797 rows/s at bs=256 on this GPU.
  batch_size: 256
  max_seq_length: 512
  device: auto
  fp16: true             # auto-disabled on pre-Volta GPUs, where it is slower
  dim: 384

sparse:
  k1: 1.2
  b: 0.75
  persist: true
  min_token_length: 2

rerank:
  enabled: true
  model_name: BAAI/bge-reranker-base
  depth: 100
  top_k: 10
  batch_size: 32
  max_seq_length: 512
  device: auto
  fp16: true

fusion:
  method: rrf
  rrf_k: 60
  dense_top_k: 100
  sparse_top_k: 100
  dense_weight: 0.6
  sparse_weight: 0.4

query:
  rewrite: heuristic
  mode: auto
  max_subqueries: 4
  max_hops: 2

serve:
  host: 127.0.0.1
  port: 8080
  warmup: true
  cors_origins: ["*"]

evaluation:
  metrics_at_k: [1, 3, 5, 10, 20, 100]
  sample_size: 1000
  seed: 13
